services:
  lookupsafe-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.dev.vars
        required: false
    ports:
      - "8787:8787"
    volumes:
      - lookupsafe-wrangler:/workspace/backend/.wrangler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  lookupsafe-wrangler:
